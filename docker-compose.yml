services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: endi_oson
      POSTGRES_USER: endi_oson
      POSTGRES_PASSWORD: endi_oson
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
